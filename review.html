<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Review Chatskee</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap">
<style>
  :root { --ground: #f5f3fb; --surface: #fff; --ink: #17142a; --muted: #5d5878; --rule: #dcd7ec; --accent: #6a45f0; --accent-ink: #fff; --star: #f5b400; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ground: #100e1a; --surface: #1a172a; --ink: #eceaf6; --muted: #a39ebf; --rule: #2e2a45; --accent: #9d86ff; --accent-ink: #120f22; } }
  :root[data-theme="dark"] { --ground: #100e1a; --surface: #1a172a; --ink: #eceaf6; --muted: #a39ebf; --rule: #2e2a45; --accent: #9d86ff; --accent-ink: #120f22; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px 16px 64px; background: var(--ground); color: var(--ink); font: 17px/1.5 "Atkinson Hyperlegible", "Segoe UI", sans-serif; }
  main { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 44px; height: 44px; }
  h1 { margin: 0; font: 800 2rem/1.1 "Bricolage Grotesque", "Trebuchet MS", sans-serif; letter-spacing: -0.02em; }
  p { margin: 0; color: var(--muted); }
  form { display: flex; flex-direction: column; gap: 16px; background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; padding: 22px; }
  label { display: flex; flex-direction: column; gap: 6px; font-weight: 700; }
  label small { font-weight: 400; color: var(--muted); }
  input, textarea { font: inherit; color: var(--ink); background: var(--ground); border: 1px solid var(--rule); border-radius: 10px; padding: 11px 12px; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea { min-height: 120px; resize: vertical; }
  .stars { display: flex; gap: 4px; }
  .stars input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .stars label { cursor: pointer; font-size: 2rem; line-height: 1; color: var(--rule); padding: 0 2px; }
  .stars input:checked ~ label { color: var(--rule); }
  .stars:has(input:nth-of-type(1):checked) label:nth-of-type(-n+1),
  .stars:has(input:nth-of-type(2):checked) label:nth-of-type(-n+2),
  .stars:has(input:nth-of-type(3):checked) label:nth-of-type(-n+3),
  .stars:has(input:nth-of-type(4):checked) label:nth-of-type(-n+4),
  .stars:has(input:nth-of-type(5):checked) label:nth-of-type(-n+5) { color: var(--star); }
  .stars label:hover, .stars label:has(~ label:hover) { color: var(--star); }
  .stars input:focus-visible + label { outline: 2px solid var(--accent); border-radius: 6px; }
  button { font: 700 1.05rem/1.2 inherit; padding: 14px 22px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  button[disabled] { opacity: 0.6; cursor: wait; }
  #msg { min-height: 1.5em; }
  #msg.ok { color: #1f9d57; font-weight: 700; }
  #msg.bad { color: #d63a3a; }
  .done { display: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; padding: 22px; }
  .done h2 { margin: 0 0 8px; font: 800 1.4rem/1.2 "Bricolage Grotesque", sans-serif; }
  .done a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="brand"><img src="icon.png" alt=""><h1>How is Chatskee treating you?</h1></div>
  <p>One honest line helps more than you think. The best ones go on the site with your channel linked, so you get a bit of exposure too.</p>

  <form id="f" novalidate>
    <label>Your name or channel name
      <input name="name" maxlength="60" required autocomplete="nickname" placeholder="e.g. ciaoloop">
    </label>
    <label>Channel link <small>optional, so we can credit you</small>
      <input name="channel" maxlength="120" placeholder="twitch.tv/yourname" autocomplete="url">
    </label>
    <div>
      <div style="font-weight:700; margin-bottom:6px">Rating</div>
      <div class="stars" role="radiogroup" aria-label="Rating out of 5">
        <input type="radio" name="rating" value="1" id="r1"><label for="r1" aria-label="1 star">&#9733;</label>
        <input type="radio" name="rating" value="2" id="r2"><label for="r2" aria-label="2 stars">&#9733;</label>
        <input type="radio" name="rating" value="3" id="r3"><label for="r3" aria-label="3 stars">&#9733;</label>
        <input type="radio" name="rating" value="4" id="r4"><label for="r4" aria-label="4 stars">&#9733;</label>
        <input type="radio" name="rating" value="5" id="r5"><label for="r5" aria-label="5 stars">&#9733;</label>
      </div>
    </div>
    <label>Your review <small>what it fixed for you, what is missing, anything</small>
      <textarea name="text" maxlength="600" required placeholder="I stream to Twitch and Kick and..."></textarea>
    </label>
    <button type="submit" id="send">Send review</button>
    <p id="msg" role="status"></p>
  </form>

  <div class="done" id="done">
    <h2>Thank you!</h2>
    <p>Got it. If it ends up on the site you will see your channel linked under it. Back to <a href="https://chatskee.app">chatskee.app</a>.</p>
  </div>
</main>

<script>
  const ENDPOINT = 'https://exaascvmmhypbhrpdwbb.supabase.co/functions/v1/chatskee-feedback';
  const version = new URLSearchParams(location.search).get('v') || '';
  const form = document.getElementById('f');
  const msg = document.getElementById('msg');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form));
    msg.className = '';
    msg.textContent = '';
    if (!data.rating) { msg.className = 'bad'; msg.textContent = 'Pick a star rating.'; return; }
    const btn = document.getElementById('send');
    btn.disabled = true;
    try {
      const r = await fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...data, version }) });
      const j = await r.json();
      if (j.ok) { form.style.display = 'none'; document.getElementById('done').style.display = 'block'; }
      else { msg.className = 'bad'; msg.textContent = j.message || 'Something went wrong.'; }
    } catch {
      msg.className = 'bad';
      msg.textContent = 'Could not reach the server. Try again in a minute.';
    }
    btn.disabled = false;
  });
</script>
</body>
</html>
